<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omarchy Store</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup" id="popup">
    <header class="popup-header">
      <div class="logo"><img src="../../assets/icons/48.png" alt=""></div>
      <div class="header-text">
        <h1>Omarchy Store</h1>
        <span class="subtitle">The world's largest app store for Omarchy</span>
      </div>
      <button class="icon-btn" id="open-sidebar" title="Open sidebar (Ctrl+Shift+O)" aria-label="Open sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
      </button>
    </header>

    <div class="popup-search">
      <input type="search" id="search-input" placeholder="Search apps..." aria-label="Search store" spellcheck="false" autocomplete="off">
    </div>

    <div class="popup-stats" id="stats">
      <span class="stat-label">Apps, browsers, terminal tools and more, ready to install on Omarchy.</span>
    </div>

    <footer class="popup-footer">
      <button class="footer-btn primary" id="open-store-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
        Open Full Store
      </button>
      <button class="footer-btn secondary" id="open-sidebar-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
        Open Sidebar
      </button>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
